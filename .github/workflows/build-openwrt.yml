name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.config'
      - 'feeds.conf.add'
      - '.github/workflows/build-openwrt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: x86_64 + PassWall + OpenClash
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python-is-python3 rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates

      - name: Clone OpenWrt source (openwrt-24.10)
        run: git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt

      - name: Add OpenClash package
        run: git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git openwrt/package/OpenClash

      - name: Prepare feeds and config
        run: |
          cd openwrt
          cat ../feeds.conf.add feeds.conf.default > feeds.conf
          echo '--- feeds.conf ---'
          cat feeds.conf
          cp ../.config .config

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve config (make defconfig + metadata patch)
        working-directory: openwrt
        run: |
          echo '=== round 1 defconfig (exposes rejected feed symbols) ==='
          make defconfig
          grep -nE '^# CONFIG_PACKAGE_luci is not set$|^# CONFIG_PACKAGE_luci-app-passwall is not set$|^CONFIG_PACKAGE_luci=y' .config | head -6 || true
          echo '=== patch generated metadata: strip depends gates on luci + passwall ==='
          awk '
            /^[ \t]*config PACKAGE_luci$/ || /^[ \t]*menuconfig PACKAGE_luci$/ || /^[ \t]*config PACKAGE_luci-app-passwall$/ || /^[ \t]*menuconfig PACKAGE_luci-app-passwall$/ { blk=1 }
            blk && /^[ \t]*depends on/ { next }
            blk && /^[ \t]*help/ { blk=0 }
            { print }
          ' tmp/.config-package.in > tmp/.cfg.new
          mv tmp/.cfg.new tmp/.config-package.in
          echo 'patched passwall block:'
          grep -A7 'config PACKAGE_luci-app-passwall$' tmp/.config-package.in | head -9
          echo 'patched luci block:'
          grep -A6 'config PACKAGE_luci$' tmp/.config-package.in | head -8
          echo '=== restore requested values ==='
          sed -i 's|^# CONFIG_PACKAGE_luci is not set$|CONFIG_PACKAGE_luci=y|' .config
          sed -i 's|^# CONFIG_PACKAGE_luci-app-passwall is not set$|CONFIG_PACKAGE_luci-app-passwall=y|' .config
          grep -q '^CONFIG_LUCI_LANG_zh-cn=y$' .config || echo 'CONFIG_LUCI_LANG_zh-cn=y' >> .config
          echo '=== round 2 defconfig (patched metadata; select closure runs) ==='
          make defconfig
          echo '=== select-closure evidence (informational) ==='
          for p in luci luci-app-passwall luci-light xray-core sing-box chinadns-ng dns2socks microsocks tcping lyaml ip-full lua haproxy geoview shadowsocks-rust-sslocal shadowsocksr-libev-ssr-local simple-obfs-client v2ray-plugin nftables luci-app-firewall luci-mod-admin-full uhttpd luci-app-package-manager; do
            grep -qE "^CONFIG_PACKAGE_$p=y" .config && echo "OK  $p" || echo "MISS $p"
          done
          grep -E 'LUCI_LANG' .config || echo '(no LUCI_LANG lines)'
          echo '--- verify key symbols ---'
          fail=0
          check_y() { grep -qE "^$1=y" .config && echo "OK  $1=y" || { echo "MISSING $1"; fail=1; }; }
          check_n() { grep -qE "^# $1 is not set" .config && echo "OK  $1 disabled" || { echo "MISSING $1 disabled"; fail=1; }; }
          check_y CONFIG_TARGET_x86
          check_y CONFIG_TARGET_x86_64
          grep -qE "^CONFIG_TARGET_ROOTFS_PARTSIZE=256" .config && echo "OK  ROOTFS_PARTSIZE=256" || echo "WARN ROOTFS_PARTSIZE not 256 (kept default)"
          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-passwall
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_dnsmasq-full
          check_n CONFIG_PACKAGE_dnsmasq
          check_n CONFIG_PACKAGE_dnsmasq-dhcpv6
          grep -qE "^CONFIG_LUCI_LANG_zh-cn=y" .config && echo "OK  CONFIG_LUCI_LANG_zh-cn=y" || echo "WARN zh-cn language symbol not set (check i18n in log)"
          if [ "$fail" -ne 0 ]; then echo "::error::config verification failed"; exit 1; fi

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)"
          echo '--- build output ---'
          ls -lh bin/targets/x86/64/

      - name: Package firmware
        run: |
          cd openwrt
          tar -czf ../firmware-x86_64.tar.gz -C bin/targets x86/64
          cd ..
          sha256sum firmware-x86_64.tar.gz > firmware-x86_64.sha256
          cat firmware-x86_64.sha256
          ls -lh firmware-x86_64.tar.gz

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-x86_64
          path: |
            firmware-x86_64.tar.gz
            firmware-x86_64.sha256
          retention-days: 30
          if-no-files-found: error
