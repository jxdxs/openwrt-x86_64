name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.config'
      - 'feeds.conf.add'
      - '.github/workflows/build-openwrt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: x86_64 + PassWall + OpenClash
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python-is-python3 rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates

      - name: Clone OpenWrt source (openwrt-24.10)
        run: git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt

      - name: Add OpenClash package with bundled Meta (mihomo) core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git openwrt/package/OpenClash
          CORE_DIR=openwrt/package/OpenClash/luci-app-openclash/root/etc/openclash/core
          mkdir -p "$CORE_DIR"
          TAG=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          ASSET="mihomo-linux-amd64-v1-${TAG}.gz"
          echo "downloading Meta core asset: $ASSET"
          curl -fL --retry 3 -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ASSET}"
          gunzip -c /tmp/mihomo.gz > "$CORE_DIR/clash_meta"
          chmod +x "$CORE_DIR/clash_meta"
          echo '--- meta core smoke test (runner is amd64) ---'
          "$CORE_DIR/clash_meta" -v
          ls -lh "$CORE_DIR"

      - name: Prepare feeds and config
        run: |
          cd openwrt
          cat ../feeds.conf.add feeds.conf.default > feeds.conf
          echo '--- feeds.conf ---'
          cat feeds.conf
          cp ../.config .config

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve config (make defconfig + metadata patch)
        working-directory: openwrt
        run: |
          echo '=== fix GOTOOLCHAIN: allow auto-download of go1.25+ toolchains ==='
          grep -n 'GOTOOLCHAIN' feeds/packages/lang/golang/golang-package.mk
          sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/' feeds/packages/lang/golang/golang-package.mk
          grep -n 'GOTOOLCHAIN' feeds/packages/lang/golang/golang-package.mk
          echo '=== round 1 defconfig (exposes rejected feed symbols) ==='
          make defconfig
          grep -nE '^# CONFIG_PACKAGE_luci is not set$|^# CONFIG_PACKAGE_luci-app-passwall is not set$|^CONFIG_PACKAGE_luci=y' .config | head -6 || true
          echo '=== patch generated metadata: strip depends gates on luci + passwall ==='
          awk '
            /^[ \t]*config PACKAGE_luci$/ || /^[ \t]*menuconfig PACKAGE_luci$/ || /^[ \t]*config PACKAGE_luci-app-passwall$/ || /^[ \t]*menuconfig PACKAGE_luci-app-passwall$/ { blk=1 }
            blk && /^[ \t]*depends on/ { next }
            blk && /^[ \t]*help/ { blk=0 }
            { print }
          ' tmp/.config-package.in > tmp/.cfg.new
          mv tmp/.cfg.new tmp/.config-package.in
          echo 'patched passwall block:'
          grep -A7 'config PACKAGE_luci-app-passwall$' tmp/.config-package.in | head -9
          echo 'patched luci block:'
          grep -A6 'config PACKAGE_luci$' tmp/.config-package.in | head -8
          echo '=== restore requested values (rejection-bug insurance) ==='
          force_y() {
            local s="$1"
            if grep -q "^$s=y$" .config; then echo "already $s"
            elif grep -q "^# $s is not set$" .config; then sed -i "s|^# $s is not set$|$s=y|" .config; echo "forced $s"
            else echo "$s=y" >> .config; echo "appended $s"; fi
          }
          force_y CONFIG_PACKAGE_luci
          force_y CONFIG_LUCI_LANG_zh_Hans
          force_y CONFIG_PACKAGE_luci-app-openclash
          echo '=== round 2 defconfig (patched metadata; select closure runs) ==='
          make defconfig
          echo '=== select-closure evidence (informational) ==='
          for p in luci luci-app-openclash luci-light dnsmasq-full bash ruby curl ca-bundle ip-full luci-compat kmod-nft-tproxy luci-i18n-base-zh-cn luci-i18n-admin-full-zh-cn luci-i18n-firewall-zh-cn luci-app-package-manager uhttpd; do
            grep -qE "^CONFIG_PACKAGE_$p=y" .config && echo "OK  $p" || echo "MISS $p"
          done
          grep -E 'LUCI_LANG_zh' .config || echo '(no zh LANG lines)'
          echo '--- verify key symbols ---'
          fail=0
          check_y() { grep -qE "^$1=y" .config && echo "OK  $1=y" || { echo "MISSING $1"; fail=1; }; }
          check_n() { grep -qE "^# $1 is not set" .config && echo "OK  $1 disabled" || { echo "MISSING $1 disabled"; fail=1; }; }
          check_y CONFIG_TARGET_x86
          check_y CONFIG_TARGET_x86_64
          grep -qE "^CONFIG_TARGET_ROOTFS_PARTSIZE=256" .config && echo "OK  ROOTFS_PARTSIZE=256" || echo "WARN ROOTFS_PARTSIZE not 256 (kept default)"
          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_LUCI_LANG_zh_Hans
          check_y CONFIG_PACKAGE_dnsmasq-full
          check_n CONFIG_PACKAGE_dnsmasq
          check_n CONFIG_PACKAGE_dnsmasq-dhcpv6
          if grep -qE '^CONFIG_PACKAGE_luci-app-passwall=y' .config; then echo "MISSING passwall should be absent"; fail=1; else echo "OK  passwall absent"; fi
          grep -qE "^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" .config && echo "OK  luci-i18n-base-zh-cn=y" || echo "WARN i18n-base-zh-cn not set (check manifest after build)"
          if [ "$fail" -ne 0 ]; then echo "::error::config verification failed"; exit 1; fi

      - name: Build firmware
        working-directory: openwrt
        run: |
          if ! make -j"$(nproc)"; then
            echo '::error::world build failed - verbose incremental retry for exact root cause'
            make -j1 V=s
            exit 1
          fi
          echo '--- verify meta core inside target rootfs ---'
          find build_dir/target-x86_64_musl/root-x86_64 -name 'clash_meta' -ls
          if ! find build_dir/target-x86_64_musl/root-x86_64 -name 'clash_meta' | grep -q .; then
            echo '::error::clash_meta core missing from target rootfs'
            exit 1
          fi
          echo '--- build output ---'
          ls -lh bin/targets/x86/64/

      - name: Publish GitHub Release (individual files, no bundling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          TITLE="OpenWrt 24.10 x86_64 build ${{ github.run_number }}"
          NOTES="Auto-built from commit ${{ github.sha }} (PassWall + OpenClash + Xray/sing-box). Each image is downloadable individually; verify with sha256sums."
          cd openwrt/bin/targets/x86/64
          FILES=$(find . -maxdepth 1 -type f | sed 's|^\./||')
          echo "assets:"; echo "$FILES"
          if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" $FILES; then
            echo "Release $TAG created"
          else
            echo "Release $TAG already exists - re-uploading assets"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          fi
