name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.config'
      - 'feeds.conf.add'
      - '.github/workflows/build-openwrt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: x86_64 + PassWall + OpenClash
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python-is-python3 rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates

      - name: Clone OpenWrt source (openwrt-24.10)
        run: git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt

      - name: Add OpenClash package
        run: git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git openwrt/package/OpenClash

      - name: Prepare feeds and config
        run: |
          cd openwrt
          cat ../feeds.conf.add feeds.conf.default > feeds.conf
          echo '--- feeds.conf ---'
          cat feeds.conf
          cp ../.config .config

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve config (make defconfig)
        working-directory: openwrt
        run: |
          make defconfig
          echo '--- DIAG: .config file format ---'
          file .config || true
          head -c 16 .config | od -c | head -2 || true
          echo '--- DIAG: .config stats ---'
          wc -l .config
          echo "PACKAGE entries: $(grep -cE '^#? ?CONFIG_PACKAGE' .config || true)"
          echo '--- DIAG: raw luci/passwall lines in .config ---'
          grep -nE 'luci' .config | head -30 || echo '(NO luci lines at all)'
          echo '--- DIAG: metadata input (tmp/.config-package.in) ---'
          if [ -f tmp/.config-package.in ]; then
            echo "metadata lines: $(wc -l < tmp/.config-package.in)"
            grep -c 'PACKAGE_luci-app-passwall' tmp/.config-package.in || echo 'passwall NOT in metadata'
            grep -cE 'config PACKAGE_luci$' tmp/.config-package.in || echo 'luci meta NOT in metadata'
            grep -c 'PACKAGE_luci-app-openclash' tmp/.config-package.in || echo 'openclash NOT in metadata'
          else
            echo 'tmp/.config-package.in MISSING'
          fi
          echo '--- DIAG: feeds list ---'
          ./scripts/feeds list 2>/dev/null | grep -E '^(luci|luci-app-passwall) ' || echo '(not in feeds index)'
          echo '--- DIAG: def lines raw for PACKAGE_luci ---'
          grep -n -B3 -A30 'config PACKAGE_luci$' tmp/.config-package.in || echo '(STILL NOT FOUND unanchored)'
          echo '--- DIAG: def lines raw for PACKAGE_luci-app-passwall ---'
          grep -n -B3 -A34 'config PACKAGE_luci-app-passwall$' tmp/.config-package.in || echo '(STILL NOT FOUND unanchored)'
          echo '--- DIAG: ip-full symbol in metadata ---'
          grep -cE 'config PACKAGE_ip-full$' tmp/.config-package.in && echo 'ip-full DEFINED' || echo 'ip-full NOT DEFINED in metadata!'
          grep -n 'PACKAGE_ip-full' tmp/.config-package.in | head -8
          echo '--- DIAG: feeds list ip* ---'
          ./scripts/feeds list 2>/dev/null | grep -E '^ip' || echo '(ip* NOT in feeds index)'
          echo '--- DIAG: .config line for passwall ---'
          grep -n 'PACKAGE_luci-app-passwall' .config || echo '(absent from .config)'
          echo '--- DIAG: key dep packages in feeds index ---'
          ./scripts/feeds list 2>/dev/null | grep -E '^(lyaml|ip-full|luci-light|luci-app-package-manager|coreutils-nohup) ' || echo '(some NOT in index)'
          echo '--- DIAG: package/feeds symlinks ---'
          ls -l package/feeds/ 2>/dev/null || true
          ls -l package/feeds/passwall_luci/ 2>/dev/null || true
          echo '--- verify key symbols ---'
          fail=0
          check_y() { grep -qE "^$1=y" .config && echo "OK  $1=y" || { echo "MISSING $1"; fail=1; }; }
          check_n() { grep -qE "^# $1 is not set" .config && echo "OK  $1 disabled" || { echo "MISSING $1 disabled"; fail=1; }; }
          check_y CONFIG_TARGET_x86
          check_y CONFIG_TARGET_x86_64
          grep -qE "^CONFIG_TARGET_ROOTFS_PARTSIZE=256" .config && echo "OK  ROOTFS_PARTSIZE=256" || echo "WARN ROOTFS_PARTSIZE not 256 (kept default)"
          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-passwall
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_dnsmasq-full
          check_n CONFIG_PACKAGE_dnsmasq
          check_n CONFIG_PACKAGE_dnsmasq-dhcpv6
          grep -qE "^CONFIG_LUCI_LANG_zh-cn=y" .config && echo "OK  CONFIG_LUCI_LANG_zh-cn=y" || echo "WARN zh-cn language symbol not set (check i18n in log)"
          if [ "$fail" -ne 0 ]; then echo "::error::config verification failed"; exit 1; fi

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)"
          echo '--- build output ---'
          ls -lh bin/targets/x86/64/

      - name: Package firmware
        run: |
          cd openwrt
          tar -czf ../firmware-x86_64.tar.gz -C bin/targets x86/64
          cd ..
          sha256sum firmware-x86_64.tar.gz > firmware-x86_64.sha256
          cat firmware-x86_64.sha256
          ls -lh firmware-x86_64.tar.gz

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-x86_64
          path: |
            firmware-x86_64.tar.gz
            firmware-x86_64.sha256
          retention-days: 30
          if-no-files-found: error
