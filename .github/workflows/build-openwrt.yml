name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.config'
      - 'feeds.conf.add'
      - '.github/workflows/build-openwrt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: x86_64 + OpenClash + 7 plugins
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python-is-python3 rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates

      - name: Clone OpenWrt source (openwrt-24.10)
        run: git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt

      - name: Add OpenClash package with latest Meta (mihomo) core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git openwrt/package/OpenClash
          rm -rf openwrt/package/OpenClash/mihomo-alpha 2>/dev/null || true
          CORE_DIR=openwrt/package/OpenClash/luci-app-openclash/root/etc/openclash/core
          mkdir -p "$CORE_DIR"
          TAG=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          ASSET="mihomo-linux-amd64-${TAG}.gz"
          echo "downloading Meta core asset: $ASSET"
          curl -fL --retry 3 -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ASSET}"
          gunzip -c /tmp/mihomo.gz > "$CORE_DIR/clash_meta"
          chmod +x "$CORE_DIR/clash_meta"
          echo '--- meta core smoke test ---'
          "$CORE_DIR/clash_meta" -v
          ls -lh "$CORE_DIR"

      - name: Stage third-party LuCI packages (installed after feeds)
        run: |
          mkdir -p /tmp/luci-extra
          git clone --depth 1 -q https://github.com/immortalwrt/luci.git /tmp/imluci
          cp -a /tmp/imluci/applications/luci-app-autoreboot /tmp/luci-extra/
          cp -a /tmp/imluci/applications/luci-app-netdata /tmp/luci-extra/
          git clone --depth 1 -q https://github.com/sirpdboy/luci-app-timecontrol.git /tmp/tc
          cp -a /tmp/tc/luci-app-timecontrol /tmp/luci-extra/
          for d in /tmp/luci-extra/luci-app-autoreboot /tmp/luci-extra/luci-app-netdata; do
            sed -i 's|include ../../luci.mk|include $(TOPDIR)/feeds/luci/luci.mk|' "$d/Makefile"
          done
          ls -la /tmp/luci-extra

      - name: Prepare feeds and config
        run: |
          cd openwrt
          cat ../feeds.conf.add feeds.conf.default > feeds.conf
          echo '--- feeds.conf ---'
          cat feeds.conf
          cp ../.config .config

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo '--- feed packages installed ---'
          for d in package/feeds/*/; do
            [ -d "$d" ] || continue
            echo "$d -> $(ls "$d" | wc -l) entries"
          done
          echo '--- feed packages installed ---'
          for d in package/feeds/*/; do
            [ -d "$d" ] || continue
            echo "$d -> $(ls "$d" | wc -l) entries"
          done

      - name: Install third-party packages into package/luci-extra
        run: |
          mkdir -p openwrt/package/luci-extra
          cp -a /tmp/luci-extra/* openwrt/package/luci-extra/
          ls -la openwrt/package/luci-extra
          echo '--- luci.mk present? (must exist before defconfig) ---'
          ls -l openwrt/feeds/luci/luci.mk

      - name: Resolve config and verify symbols
        working-directory: openwrt
        run: |
          echo '=== allow auto Go toolchain ==='
          if [ -f feeds/packages/lang/golang/golang-package.mk ]; then
            sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/' feeds/packages/lang/golang/golang-package.mk || true
          fi
          echo '=== force-rebuild package index (critical) ==='
          # feeds update 建立的索引只含核心包（约 2714 个），feeds install
          # 装入的 feed 包不会自动进入索引。prepare-tmpinfo 因时间戳短路
          # (`[ "$t" -nt "$f" ]`) 也不会重建，必须显式删除索引文件。
          rm -f tmp/.packageinfo tmp/.config-package.in
          make prepare-tmpinfo
          IDX=$(grep -c '^[[:space:]]*config PACKAGE_' tmp/.config-package.in 2>/dev/null || echo 0)
          echo "index packages: $IDX"
          echo "luci in index: $(grep -c '^[[:space:]]*config PACKAGE_luci$' tmp/.config-package.in 2>/dev/null || echo 0)"
          if [ "$IDX" -lt 10000 ]; then
            echo '::error title=incomplete package index::index has only '"$IDX"' packages, expected ~12000'
            exit 1
          fi
          echo '=== defconfig ==='
          make defconfig
          echo '=== verify key symbols ==='
          fail=0
          check_y() {
            if grep -qE "^$1=y" .config; then
              echo "OK  $1=y"
            else
              echo "MISSING $1 (actual: $(grep -E "^(# )?$1( is not set|=)" .config | head -1))"
              echo "::error title=Missing symbol::$1"
              fail=1
            fi
          }
          check_n() {
            if grep -qE "^# $1 is not set" .config; then
              echo "OK  $1 disabled"
            else
              echo "MISSING $1 disabled (actual: $(grep -E "^(# )?$1( is not set|=)" .config | head -1))"
              echo "::error title=Symbol should be disabled::$1"
              fail=1
            fi
          }
          check_y CONFIG_TARGET_x86
          check_y CONFIG_TARGET_x86_64
          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_LUCI_LANG_zh_Hans
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_dnsmasq-full
          check_n CONFIG_PACKAGE_dnsmasq
          check_n CONFIG_PACKAGE_dnsmasq-dhcpv6
          check_n CONFIG_RUBY_ENABLE_YJIT
          check_y CONFIG_PACKAGE_frpc
          check_y CONFIG_PACKAGE_luci-app-frpc
          check_y CONFIG_PACKAGE_netdata
          check_y CONFIG_PACKAGE_luci-app-netdata
          check_y CONFIG_PACKAGE_luci-app-statistics
          check_y CONFIG_PACKAGE_ttyd
          check_y CONFIG_PACKAGE_luci-app-ttyd
          check_y CONFIG_PACKAGE_luci-app-timecontrol
          check_y CONFIG_PACKAGE_luci-app-autoreboot
          check_y CONFIG_PACKAGE_openlist
          check_y CONFIG_PACKAGE_luci-app-openlist
          if grep -qE '^CONFIG_PACKAGE_nikki=y' .config; then
            echo "::error title=nikki present::nikki must be absent"
            fail=1
          else
            echo "OK  nikki absent"
          fi
          if grep -qE '^CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config; then
            echo "OK  PARTSIZE=1024"
          else
            echo "WARN PARTSIZE mismatch"
          fi
          if [ "$fail" -ne 0 ]; then
            echo '::error title=config verification failed::see MISSING lines above'
            exit 1
          fi

      - name: Build firmware
        working-directory: openwrt
        run: |
          if ! make -j"$(nproc)"; then
            echo '::error::world build failed - verbose retry'
            make -j1 V=s
            exit 1
          fi
          echo '--- verify meta core inside target rootfs ---'
          CORE_HIT=$(find build_dir -name 'clash_meta' -type f 2>/dev/null | head -1)
          echo "clash_meta found at: ${CORE_HIT:-<not found>}"
          if [ -z "$CORE_HIT" ]; then
            echo '::error::clash_meta core missing from build_dir'
            exit 1
          fi
          echo 'meta core bundle verified'
          ls -lh bin/targets/x86/64/

      - name: Publish GitHub Release (individual files)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          TITLE="OpenWrt 24.10 x86_64 build ${{ github.run_number }}"
          NOTES="OpenWrt 24.10 x86_64, root 1024MB. OpenClash 0.47.x with latest Meta (mihomo) core at /etc/openclash/core/clash_meta. Plugins: frp, netdata, luci-app-statistics, ttyd, timecontrol, autoreboot, openlist. zh_Hans LuCI."
          cd openwrt/bin/targets/x86/64
          FILES=$(find . -maxdepth 1 -type f | sed 's|^\./||')
          echo "assets:"; echo "$FILES"
          if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" $FILES; then
            echo "Release $TAG created"
          else
            echo "Re-uploading assets"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          fi
